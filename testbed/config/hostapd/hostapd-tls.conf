# EAP-TLS authenticator for benchmark (Issue #14)
# Uses PKI certificates, no Identus, no proxies

interface=eth0
driver=wired
ieee8021x=1
use_pae_group_addr=1

eap_server=1
eap_user_file=/etc/hostapd/hostapd.eap_user.tls

# PKI certificates
ca_cert=/etc/certs/ca.pem
server_cert=/etc/certs/server.pem
private_key=/etc/certs/server-key.pem

logger_stdout=-1
logger_stdout_level=1
