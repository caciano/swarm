# Authenticator with INTEGRATED EAP server (default, two-container setup).
# Smoke test uses EAP-MD5 so no certificates are needed to validate that
# EAPoL traverses the bridge and the EAP state machine completes.

interface=eth0
driver=wired
ieee8021x=1
use_pae_group_addr=1

eap_server=1
eap_user_file=/etc/hostapd/hostapd.eap_user

# Logging to stdout (hostapd -t prepends timestamps for latency capture).
logger_stdout=-1
logger_stdout_level=1

# ---- For PEAP / EAP-TTLS baselines, generate certs (./scripts/gen-certs.sh)
# ---- and uncomment:
## TLS certs: use radius-tls.conf for EAP-TLS
#ca_cert=/etc/hostapd/certs/ca.pem
#server_cert=/etc/hostapd/certs/server.pem
#private_key=/etc/hostapd/certs/server-key.pem

# EAP-DID: async HTTP operations need more short rounds
max_auth_rounds_short=2000
max_auth_rounds=4000
