# Authenticator in PASSTHROUGH mode (eap_server=0), co-located with the RADIUS
# backend in the SAME container. EAP is relayed over loopback to the local
# RADIUS/EAP server (radius.conf), which is where the EAP-DID server method and
# the HERMES verifier live.
#
# Started by scripts/entrypoint-authradius.sh together with radius.conf.

interface=eth1
driver=wired
ieee8021x=1
use_pae_group_addr=1

eap_server=0

own_ip_addr=127.0.0.1
nas_identifier=swarm-authenticator
auth_server_addr=127.0.0.1
auth_server_port=1812
auth_server_shared_secret=testing123

logger_stdout=-1
logger_stdout_level=1
