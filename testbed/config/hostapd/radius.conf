# RADIUS / EAP-server backend (used only by the `passthrough` profile).
# hostapd runs without a real radio (driver=none) and serves RADIUS on 1812.
# This is the natural home for the EAP-DID server method + HERMES verifier.

driver=none
interface=lo

eap_server=1
eap_user_file=/etc/hostapd/hostapd.eap_user

radius_server_clients=/etc/hostapd/radius_clients
radius_server_auth_port=1812

logger_stdout=-1
logger_stdout_level=1

# ---- For PEAP / EAP-TTLS baselines, uncomment after running gen-certs.sh: ----
## TLS certs: use radius-tls.conf for EAP-TLS
#ca_cert=/etc/hostapd/certs/ca.pem
#server_cert=/etc/hostapd/certs/server.pem
#private_key=/etc/hostapd/certs/server-key.pem

# EAP-DID: async HTTP operations need more short rounds
max_auth_rounds_short=2000
max_auth_rounds=4000
